[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-user-doctor"
version = "1.0.0"
description = "Audit a WordPress users CSV export: orphaned admins, stale accounts, default admin, multiple roles, personal emails on admins"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
wp-user-doctor = "wp_user_doctor:main_entry"

[tool.setuptools]
py-modules = ["wp_user_doctor"]
